<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Center Glow -->
  <circle cx="600" cy="150" r="320" fill="url(#glow)"/>

  <!-- Minimalist Optics Grid -->
  <g stroke="#334155" stroke-width="1" fill="none" opacity="0.35">
    <circle cx="600" cy="150" r="90" stroke-dasharray="4 4"/>
    <circle cx="600" cy="150" r="140"/>
    <circle cx="600" cy="150" r="190" stroke-dasharray="6 6"/>
    <line x1="360" y1="150" x2="840" y2="150" stroke="#1e293b"/>
    <line x1="600" y1="40" x2="600" y2="260" stroke="#1e293b"/>
  </g>

  <!-- Big Clean Brand Title Only (No slogan, no description) -->
  <text x="600" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="24" fill="url(#textGrad)">ARGUS</text>
</svg>
